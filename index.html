<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Kit</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-countTo/1.2.0/jquery.countTo.min.js"></script>
</head>
<body>
    <header>
        <h1>Welcome to the Press Kit</h1>
    </header>
    <section id="soundcloud">
        <h2>Listen on SoundCloud</h2>
        <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/rqhq4real&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false"></iframe>
    </section>
    <section id="stats">
        <h2>Stats</h2>
        <div class="stat">
            <h3>Downloads</h3>
            <span class="count" data-count="1000">0</span>
        </div>
        <div class="stat">
            <h3>Plays</h3>
            <span class="count" data-count="5000">0</span>
        </div>
    </section>
    <script>
        $('.count').each(function () {
            var $this = $(this);
            $this.prop('Counter', 0).animate({
                Counter: $this.data('count')
            }, {
                duration: 4000,
                easing: 'swing',
                step: function (val) {
                    $this.text(Math.ceil(val));
                }
            });
        });
    </script>
</body>
</html>
